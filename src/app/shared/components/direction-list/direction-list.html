<div class="direction-list">
  @if (chefs().length > 1) {
    <div class="direction-list__toolbar">
      <div class="direction-list__filter" role="group" aria-label="Show steps of">
        <app-tag
          label="All"
          [isActive]="selectedChef() === null"
          (tagClick)="selectChef(null)"
        />
        @for (chef of chefs(); track chef) {
          <app-tag
            [label]="'Chef ' + chef"
            [isActive]="selectedChef() === chef"
            (tagClick)="selectChef(chef)"
          />
        }
      </div>
      <p class="direction-list__progress" aria-live="polite">
        {{ doneCount() }} of {{ visibleSteps().length }} done
      </p>
    </div>
  }
  <ol class="direction-list__steps">
    @for (step of visibleSteps(); track step.number) {
      <li>
        <app-direction-step
          [number]="step.number"
          [title]="step.title"
          [description]="step.description"
          [chef]="step.chef"
          [isDone]="doneSteps().has(step.number)"
          (isDoneChange)="setDone(step.number, $event)"
        />
      </li>
    }
  </ol>
</div>
