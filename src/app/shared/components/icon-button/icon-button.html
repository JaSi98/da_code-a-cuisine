<button
  class="icon-button"
  [class]="'icon-button--' + icon()"
  [class.icon-button--on-dark]="isOnDark()"
  [type]="type()"
  [disabled]="isDisabled()"
  [attr.aria-label]="ariaLabel()"
  (click)="emitClick()"
>
  <svg class="icon-button__icon" [attr.viewBox]="viewBox()" aria-hidden="true">
    <use [attr.href]="iconHref()"></use>
  </svg>
</button>
