<a class="popular-recipe-card" [routerLink]="link()">
  <span class="popular-recipe-card__content">
    <span class="popular-recipe-card__time">
      <svg class="popular-recipe-card__time-icon" viewBox="0 -960 960 960" aria-hidden="true">
        <use href="assets/icons/schedule.svg#icon"></use>
      </svg>
      Cooking time: {{ cookingTime() }}min
    </span>
    <span class="popular-recipe-card__title">{{ title() }}</span>
  </span>
  <app-like-count [count]="likes()" />
</a>
