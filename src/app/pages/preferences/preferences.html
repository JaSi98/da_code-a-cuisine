<!-- Placeholder until the page is built; temporary component preview for review. -->
<main style="display: flex; gap: 120px; padding: 64px">
  <app-counter-field
    label="How many portions you need?"
    unit="Portion"
    unitPlural="Portions"
    [min]="servingsRange.min"
    [max]="servingsRange.max"
    [(value)]="servings"
  />
  <app-counter-field
    label="How many are cooking?"
    unit="Person"
    unitPlural="Persons"
    [min]="cooksRange.min"
    [max]="cooksRange.max"
    [(value)]="cooks"
  />
</main>
<section
  style="
    display: flex;
    flex-direction: column;
    gap: 40px;
    max-width: 450px;
    margin: 0 64px;
    padding: 24px;
    border-radius: 20px;
    background: rgba(57, 96, 57, 0.2);
  "
>
  <app-preference-group
    legend="Cooking time"
    icon="schedule"
    [options]="cookingTimeOptions"
    [(selected)]="cookingTime"
  />
  <app-preference-group
    legend="Cuisine"
    icon="globe"
    [options]="cuisineOptions"
    [(selected)]="cuisine"
  />
  <app-preference-group
    legend="Diet preferences"
    icon="restaurant"
    [options]="dietOptions"
    [(selected)]="diet"
  />
  <p>Selected: {{ cookingTime() }} / {{ cuisine() }} / {{ diet() }}</p>
</section>
