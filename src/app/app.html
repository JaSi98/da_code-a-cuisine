<!-- Temporary component preview for review; removed after approval. -->
<main class="preview">
  <section class="preview__area">
    <h2>Ingredient input (try "Pas", "Tom" or "Ch")</h2>
    <app-ingredient-input
      [suggestions]="previewSuggestions"
      (ingredientAdd)="previewAdded.update((list) => [$event, ...list])"
    />
    <p>Added (newest first):</p>
    <ul>
      @for (entry of previewAdded(); track $index) {
        <li>{{ entry.name }} – {{ entry.amount }} {{ entry.unit }}</li>
      }
    </ul>
  </section>
</main>
<router-outlet />
