<main class="preview">
  <section class="preview__area preview__popular">
    @for (recipe of previewRecipes; track recipe.title) {
      <app-popular-recipe-card
        [title]="recipe.title"
        [cookingTime]="recipe.cookingTime"
        [likes]="recipe.likes"
        link="/"
      />
    }
  </section>
</main>
