<!-- Temporary component preview for review; removed after approval. -->
<main class="preview">
  <section class="preview__area preview__list">
    <h2>Ingredient list item (hover, edit, delete)</h2>
    <ul class="preview__plain-list">
      @for (entry of previewEntries(); track entry.name) {
        <li>
          <app-ingredient-list-item
            [entry]="entry"
            (entryChange)="replacePreviewEntry(entry, $event)"
            (entryRemove)="removePreviewEntry(entry)"
          />
        </li>
      }
    </ul>
  </section>
</main>
<router-outlet />
