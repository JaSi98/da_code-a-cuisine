<!-- Temporary component preview for review; removed after approval. -->
<main class="preview">
  <section class="preview__area">
    <h2>Like button (click toggles)</h2>
    <div class="preview__row">
      <app-like-button
        [isLiked]="previewLiked()"
        (likeToggle)="previewLiked.set(!previewLiked())"
      />
      <app-like-button [isLiked]="true" />
      <app-like-button [isDisabled]="true" />
    </div>
  </section>
</main>
<router-outlet />
