<main class="preview">
  <section class="preview__area">
    <h2>Expand toggle</h2>
    <app-expand-toggle controlsId="preview-list" [(isExpanded)]="previewExpanded" />
    <ul id="preview-list">
      <li>Pasta</li>
      <li>Tomatoes</li>
      @if (previewExpanded()) {
        <li>Spinach</li>
        <li>Garlic</li>
        <li>Olive oil</li>
      }
    </ul>
  </section>
</main>
<router-outlet />
