<main class="preview">
  <section class="preview__area preview__narrow">
    <h2>Input</h2>
    <app-input label="Ingredient" placeholder="e.g. Pasta" [formControl]="previewName" />
    <app-input label="Amount" type="number" placeholder="100" [formControl]="previewAmount" />
    <app-input ariaLabel="Without label" placeholder="Field without visible label" />
    <p>Values: {{ previewNameValue() }} / {{ previewAmountValue() }}</p>
  </section>
</main>
